version: '3.8'
services:
  portainer:
    image: portainer/portainer
    volumes:
      - '/opt/festa/portainer:/data'
      - '/var/run/docker.sock:/var/run/docker.sock'
    ports:
      - 9000:9000
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.services.portainer.loadbalancer.server.port=9000'
      - 'traefik.http.routers.portainer.rule=Host(`admin.festa.lan`)'
      - 'traefik.http.routers.portainer.entrypoints=websecure'
      - 'traefik.http.routers.portainer.tls.certresolver=mydnschallenge'
    command:
      - --no-analytics
      - --host=unix:///var/run/docker.sock
    networks:
      - traefik
  traefik:
    image: traefik
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "/opt/mediadepot/traefik/letsencrypt:/letsencrypt"
    command:
      - "--api.insecure=true"
      - "--providers.docker"
      - "--providers.docker.exposedByDefault=false"
      - "--providers.docker.network=traefik"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.mydnschallenge.acme.dnschallenge=true"
      - "--certificatesresolvers.mydnschallenge.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.mydnschallenge.acme.email=postmaster@admin.nicholasfesta.com"
      - "--certificatesresolvers.mydnschallenge.acme.storage=/letsencrypt/acme.json"
    networks:
      - traefik
networks:
  traefik:
    external: true
